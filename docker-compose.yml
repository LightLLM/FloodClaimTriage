version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flood-triage-postgres
    environment:
      POSTGRES_DB: flood_triage
      POSTGRES_USER: flooduser
      POSTGRES_PASSWORD: floodpass
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flooduser -d flood_triage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flood-triage-network

  minio:
    image: minio/minio:latest
    container_name: flood-triage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - flood-triage-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: flood-triage-api
    environment:
      DATABASE_URL: postgresql+asyncpg://flooduser:floodpass@postgres:5432/flood_triage
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: flood-triage-data
      JWT_SECRET: dev-secret-change-in-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - flood-triage-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: flood-triage-web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    command: pnpm dev --host 0.0.0.0
    networks:
      - flood-triage-network

volumes:
  postgres_data:
  minio_data:

networks:
  flood-triage-network:
    driver: bridge
